spring.application.name=hospital-backend
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/hospitaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Storage (Simulated)
app.storage.location=uploads

# Logging Configuration
logging.file.path=logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.hospital=INFO
logging.level.com.hospital.service.AuditLogService=DEBUG
logging.level.com.hospital.aspect.AuditLogAspect=DEBUG
